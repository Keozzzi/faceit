<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>faceit</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 42px;
            color: #f8f7f8;
        }

        p {
            color: #fcfafa;
            font-size: 18px;
        }

        button {
            background: #fffeff;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ffffff;
        }
    </style>
</head>

<body>
    <div class="container">
        <h6>faceit</h6>
    </div>
</body>
</html>
